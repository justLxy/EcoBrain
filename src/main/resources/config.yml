## ============================================================
##  EcoBrain 7.0  ·  主配置文件
## ============================================================
##  修改后执行  /ecobrain reload  即可热更新生效。
##
##  填写须知：
##    1. 小数用英文句号，例如 0.30（不要写成 0,30）
##    2. 百分比一律填小数，例如 30% -> 0.30
##    3. 材质名填错会自动回退默认材质，不会崩服
##    4. 建议每次只调个别参数，观察市场反应后再继续
##    5. 拿不准的直接用推荐值
## ============================================================


## ------------------------------------------------------------
##  经济 · 金库
## ------------------------------------------------------------
##  全局金库遵循「收入 = 支出」，系统不会无限发钱：
##    · 玩家 BUY  ->  金币进入金库
##    · 玩家 SELL ->  金币从金库支出（余额不足时拒绝收购）
economy:
  treasury:
    # 冷启动金库余额（金币）。给一个能支撑早期回收的数值，例如 200000 ~ 500000。
    initial-balance: 500000


## ------------------------------------------------------------
##  交易 · 防刷
## ------------------------------------------------------------
trade:
  # 交易防连点冷却（毫秒，1000 = 1 秒）。防脚本/连点器刷单。推荐 800 ~ 2500。
  cooldown-ms: 500

  # 按 Q（丢弃键）时，首次会自动打开「批量出售」GUI 以防误丢。
  # 若在该窗口（毫秒）内再次快速按 Q，则视为刻意丢弃并放行，不再反复弹窗。推荐 500 ~ 1200。
  qdrop-open-bulk-sell-window-ms: 60000


## ------------------------------------------------------------
##  风控 · 熔断
## ------------------------------------------------------------
circuit-breaker:
  # 涨跌停板：物品单日价格相对开盘价波动超过该百分比即冻结交易。
  daily-limit-percent: 100

  # 库存熔断线：系统真实库存 <= 该值时禁止玩家继续买入，防止被抽干。
  critical-inventory: 1


## ============================================================
##  定价引擎  ·  卡尔曼滤波 + Avellaneda-Stoikov 做市
## ============================================================
##  设计取向：少特征工程、多原理。
##  价格 = 对数公允价值后验(x) 经做市偏移后得到的 bid / ask。
##
##  【诚实边界 · 务必理解】
##  本服系统是唯一对手方，价格的唯一数据源就是系统自己的报价——这个
##  「循环论证」是 P2S 市场的结构性特征，任何算法都无法根除。下方的
##  process-noise 会借「交易者多样性」抑制单人反复刷价的正反馈，但这
##  是缓解而非根治。它真正能做的是：在有限且可能被操纵的证据下，给出
##  一个不确定性诚实、对异常成交鲁棒、且做市商自身风险可控的报价。
## ============================================================
pricing:

  ## —— 核心风险与滤波 ——
  # A-S 风险厌恶系数 γ。越大：库存/金库失衡对报价的偏移越强、价差越宽。推荐 0.05 ~ 0.30。
  gamma: 0.15

  # 卡尔曼过程噪声 q（每小时）。公允价值随机游走强度：
  #   越大 -> 越「善变」、越快跟随近期成交；越小 -> 越「稳重」、越依赖历史。
  #   无人交易时不确定性按 q·Δt 自然上升（价差变宽）。推荐 0.01 ~ 0.05。
  process-noise-per-hour: 0.02

  # 单笔成交观测噪声基准 r0。实际噪声 = r0 / 成交量，即大单更可信、对公允价拉动更大。
  observation-noise-base: 1.0

  # 鲁棒似然自由度 dof（Student-t）。越小越抗异常：洗价/对倒等离群成交会被自动
  #   降权到接近 0，从而无需任何一条「反操纵规则」。推荐 3 ~ 8；设很大会退化为
  #   普通高斯（不再抗操纵）。
  student-t-dof: 4

  ## —— 价差与波动 ——
  # 已实现波动率 EWMA 半衰期（小时）。越短越敏感于近期波动，价差随之更快张缩。
  volatility-half-life-hours: 12

  # 最小 half-spread（做市手续费下限）。总价差 = base-fee + 0.5·γ·σ²。推荐 0.03 ~ 0.10。
  base-fee: 0.05

  ## —— 库存 / 金库风险偏移 ——
  # 进入 reservation price 的权重：
  #   · inventory：库存越低于目标浮动，ask/bid 越上移（鼓励回补）
  #   · treasury ：金库越紧张，bid 越下压（做市商用价格自我保护，而非硬拒收）
  inventory-risk-weight: 1.0
  treasury-risk-weight: 1.0

  ## —— 流动性深度 ——
  # 目标浮动量决定库存压力的归一化基准；depth 决定大单的边际滑点强度。
  trusted-float-baseline: 16.0
  min-depth: 16.0
  max-depth: 2048.0

  ## —— 新物品冷启动 ——
  # 中性锚点价（后验初始中心，非承诺收购价）与初始不确定性方差。
  #   初始方差越大，新物品开局价差越宽、越快被前几笔成交带动。
  anchor-price: 100.0
  initial-variance: 5.0

  ## —— 抗操纵与清理 ——
  # 交易者多样性统计窗口（小时）。窗口内独立交易者越少，过程噪声被放大得越多。
  diversity-window-hours: 24

  # 滞销物品自动清理天数（库存极低且长期无人问津的物品档案会被清除）。
  garbage-collection-days: 7


## ============================================================
##  界面 · GUI
## ============================================================
gui:

  ## —— 批量出售界面 ——
  bulk-sell:
    title: "&2EcoBrain 批量出售界面"

    sell-button:
      material: LIME_STAINED_GLASS_PANE
      name: "&a确认出售"
      lore:
        - "&7点击后将结算 0-44 格全部物品"

    cancel-button:
      material: RED_STAINED_GLASS_PANE
      name: "&c取消并退回"
      lore:
        - "&7安全退回所有待售物品"

    filler:
      material: BLACK_STAINED_GLASS_PANE

  ## —— 市场大盘物品 lore ——
  ##  可用占位符：
  ##    {price} 系统售价(ask)   {bid} 系统收购价   {mid} 中价
  ##    {tier} 市场评价         {confidence} 价格状态   {stage_desc} 阶段说明
  ##    {physical_stock} 库存   {spread} 价差(%)   {sigma} 不确定性
  market:
    item-lore:
      - ""
      - '&7&m+------------------------------+'
      - ''
      - '        &b系统售价: &f{price}￥'
      - '        &b系统收购价: &f{bid}￥'
      - '        &b市场评价: {tier}'
      - '        &b价格状态: {confidence}'
      - '        &b库存数量: &f{physical_stock} 个'
      - '        &8{stage_desc}'
      - '        &f&l单击 &7购买 1 个'
      - '        &f&lShift+单击 &7购买 1 组'
      - '        &f&lShift+右键 &7购买 10 组'
      - '        &f&l右键 &7自定义数量购买（聊天输入）'
      - ''
      - '&7&m+------------------------------+'


## ============================================================
##  主手提示  ·  引导玩家发现系统市场（Title / 副Title）
## ============================================================
market-hint:
  # 是否启用「主手物品在市场有货时」的提示
  enabled: true

  # 防抖延迟（tick）。滚轮快速切换物品时，只在停下后提示最后一个。
  debounce-ticks: 4

  # 显示时长（tick）。默认约 2 秒：fade-in 5 + stay 30 + fade-out 5 = 40 tick。
  fade-in-ticks: 5
  stay-ticks: 30
  fade-out-ticks: 5

  # 是否要求「至少能买 1 个」才提示（避免提示后却买不了：冻结 / 库存保护 / 流动性不足）。
  require-buyable: true

  # 文案模板：{item} 物品名 · {price} 售价(ask) · {cmd} 指令
  title: "&7你感受到一笔&f交易机会"
  subtitle: "&f{item} &7在市场有货：&e{price}&7｜&b{cmd}"

  # 指令展示文案
  command: "/ecobrain buy <数量>"


## ============================================================
##  管理命令扩展  ·  QuickTax 集成（系统资金回收）
## ============================================================
admin:
  reclaim:
    # 「系统资金回收」按玩家统计净支出：
    #   outstanding = SUM(SELL) - SUM(BUY) - SUM(已回收)
    # 随后用 QuickTax 命令逐个玩家扣款。
    # 若需允许扣到负数，请在 QuickTax 的 config.yml 设置 debt-mode=2。
    #
    # 占位符：{player} 玩家名 · {uuid} UUID · {amount} 金额（两位小数）
    quicktax-command: "qt collectname {player} {amount}"

    # 小于等于该金额的 outstanding 不处理（防浮点噪声）。
    min-amount: 0.01

    # 每 tick（50ms）最多派发多少条 QuickTax 命令，避免主线程卡顿。
    per-tick: 5

    # 是否在扣款后私聊在线玩家一条提示（展示当前 Vault 余额，可为负数）。
    notify-player: true

    # 私聊模板（仅在线玩家会收到）：
    #   {player} 玩家名 · {uuid} UUID · {amount} 本次回收金额 · {balance} 回收后余额
    notify-message: "&e系统资金回收：已扣除 &f{amount}&e，当前余额 &f{balance}"
